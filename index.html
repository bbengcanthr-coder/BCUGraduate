<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบออกปริญญาบัตร - มหาวิทยาลัยเบงจันทร์</title>
    <style>
        /* นำเข้า Font */
        @font-face {
            font-family: 'TH Dan Vi Vek ver 1.03';
            src: url('TH Dan Vi Vek ver 1.03.ttf') format('truetype'); 
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --primary-color: #9d8048; 
            --bg-color: #f9f9f9;
            --text-color: #333;
        }

        body {
            font-family: 'TH Dan Vi Vek ver 1.03', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-field {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
        }

        .input-field label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }

        .input-field input, .input-field select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-field input:focus, .input-field select:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-generate {
            background-color: #333;
            color: white;
        }

        .btn-generate:hover {
            background-color: #111;
        }

        .btn-download {
            background-color: var(--primary-color);
            color: white;
            display: none; 
        }

        .btn-download:hover {
            background-color: #7d6537;
        }

        .canvas-container {
            margin-top: 30px;
            text-align: center;
            width: 100%;
            overflow: hidden;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: none; 
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .btn-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

<script>
    // ตั้งค่าตัวแปร
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const templateImage = new Image();
    
    // อ้างอิงไฟล์รูปภาพเทมเพลต (ชื่อไฟล์ต้องตรงกันทุกประการ)
    templateImage.src = 'ปริญญาบัตร.jpg';
    
    // แก้ไข: พรีโหลดฟอนต์ให้ถูกชื่อ เพื่อให้ฟอนต์ติดตั้งแต่ครั้งแรกที่เปิด
    document.fonts.load('370px "TH Dan Vi Vek ver 1.03"').then(() => {
        console.log("Font loaded");
    });

    function generateCert() {
        const title = document.getElementById('title').value.trim();
        const fname = document.getElementById('firstname').value.trim();
        const lname = document.getElementById('lastname').value.trim();
        const degree = document.getElementById('degree').value;

        const fullName = `${title} ${fname} ${lname}`;

        // แก้ไข: ใช้ naturalWidth / naturalHeight ป้องกันบั๊กเบราว์เซอร์มือถืออ่านขนาดผิด
        canvas.width = templateImage.naturalWidth || templateImage.width;
        canvas.height = templateImage.naturalHeight || templateImage.height;

        // วาดภาพพื้นหลัง
        ctx.drawImage(templateImage, 0, 0, canvas.width, canvas.height);

        // ตั้งค่ารูปแบบข้อความทั่วไป
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#616161';
        
        // แก้ไข: บังคับวาดจากซ้าย (left) เสมอ แล้วใช้คณิตศาสตร์หาจุดกึ่งกลางแทน
        ctx.textAlign = 'left';
        
        const maxWidth = canvas.width - 300; // ขอบซ้ายขวาด้านละ 150px

        // --- ส่วนที่ 1: ชื่อ-นามสกุล ---
        ctx.font = '370px "TH Dan Vi Vek ver 1.03"';
        const nameY = canvas.height * 0.47; 
        
        // คำนวณความกว้างข้อความที่จะวาดจริง (ถ้ายาวเกิน maxWidth ระบบจะบีบลงมาเหลือเท่ากับ maxWidth)
        const nameMetrics = ctx.measureText(fullName);
        const nameDrawnWidth = Math.min(nameMetrics.width, maxWidth);
        
        // คำนวณพิกัด X ให้ข้อความอยู่ตรงกลางเป๊ะๆ
        const nameX = (canvas.width - nameDrawnWidth) / 2;
        ctx.fillText(fullName, nameX, nameY, maxWidth);

        // --- ส่วนที่ 2: ปริญญาบัตร ---
        ctx.font = '370px "TH Dan Vi Vek ver 1.03"';
        const degreeY = canvas.height * 0.67;
        
        const degreeMetrics = ctx.measureText(degree);
        const degreeDrawnWidth = Math.min(degreeMetrics.width, maxWidth);
        
        const degreeX = (canvas.width - degreeDrawnWidth) / 2;
        ctx.fillText(degree, degreeX, degreeY, maxWidth);

        // แสดงผล Canvas และปุ่มดาวน์โหลด
        canvas.style.display = 'block';
        document.getElementById('downloadBtn').style.display = 'block';
    }

    function downloadCert() {
        const fname = document.getElementById('firstname').value.trim();
        // แปลง Canvas เป็น Data URL
        const dataURL = canvas.toDataURL('image/jpeg', 1.0);
        
        // สร้างแท็กลิงก์สำหรับการดาวน์โหลด
        const link = document.createElement('a');
        link.download = `Degree_${fname}.jpg`;
        link.href = dataURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
